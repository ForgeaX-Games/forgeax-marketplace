packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/*/backend'
  - 'apps/*/frontend'

# esbuild ships a native postinstall build script that pnpm 11 blocks by default
# (ERR_PNPM_IGNORED_BUILDS); allowBuilds approves it so `pnpm install` runs the
# build. NB pnpm 11.7's field is `allowBuilds` (name: true), not
# onlyBuiltDependencies — value must be boolean true.
allowBuilds:
  esbuild: true
